<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src *">
  <title>BlitzPay Kitchen</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="../dist/renderer/app.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand"><img src="assets/bona-me-logo.png" alt="bona’me"><span id="screen-label"></span></div>
    <div class="header-tools"><span id="connection" role="status"></span><button id="mute" type="button" aria-pressed="false"></button><button id="theme" type="button"></button></div>
  </header>
  <div id="offline" class="hidden" role="status"></div>
  <main class="workspace">
    <section class="queue-panel" aria-labelledby="queue-title">
      <div class="queue-heading"><h1 id="queue-title"></h1><span id="queue-count"></span></div>
      <nav id="filters" aria-label="Order filters"></nav>
      <div id="queue" class="queue-scroll"></div>
    </section>
    <section id="detail" class="detail-panel" aria-label="Focused order"></section>
  </main>
  <div id="undo" aria-live="polite"></div>
  <div id="announcements" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
